name: Checks

# Переиспользуемые проверки (тесты и clippy на Windows и macOS). Вызывается из ci.yml и release.yml,
# поэтому релиз публикуется только после успеха тех же проверок на том же коммите.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Тесты
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
