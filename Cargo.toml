[package]
name = "preset-launcher"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
getrandom = "0.4.3"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
toml = "1.2.1"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Power", "Win32_System_WinRT", "Win32_System_Shutdown", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Input_KeyboardAndMouse", "UI_Notifications", "Data_Xml_Dom"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# tiny_http 0.12.0 с исправлением Drop у EqualReader (аллокация размером с Content-Length).
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
